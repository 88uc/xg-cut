workflows:
  android-workflow:
    name: Android Node Build Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
    scripts:
      - name: Extract Project Files
        script: |
          unzip xg-cut-github-build.zip -d extracted_project || true
          cd extracted_project && cd $(ls -d */ | head -n 1) && cp -r ./* ../../ || true
      - name: Install Node Dependencies
        script: |
          npm install --legacy-peer-deps || yarn install || true
      - name: Set up local.properties
        script: |
          mkdir -p android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Clean and Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleRelease --no-daemon
    artifacts:
      - "**/build/outputs/apk/release/*.apk"
